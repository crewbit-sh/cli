# Temporary. Investigates the CI-only failure of git.test.ts:191
# ("says no when the remote cannot be read at all"). Deleted once the cause
# is known — not part of the release pipeline.
name: Debug ls-remote

on:
  workflow_dispatch: {}

jobs:
  debug:
    name: Debug
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Full suite x10, keep going even when one run fails
        run: |
          for i in $(seq 1 10); do
            echo "::group::full suite run $i"
            bun test --timeout 60000 2>&1 | tee /tmp/run-$i.log | grep -E "DIAG|^ [0-9]+ (pass|fail)|Ran [0-9]+ tests" || true
            echo "::endgroup::"
          done
      - name: Print full log of any run that hit the diagnostic
        if: always()
        run: grep -l "DIAG" /tmp/run-*.log | xargs -I{} sh -c 'echo ===={}====; cat {}' || echo "no run hit the diagnostic"
