name: Release

# Manual on purpose: a bump computed from commits and written to package.json,
# CHANGELOG.md and RUNNER_VERSION, then tagged and published, is a release
# somebody decided to cut. workflow_dispatch means nothing happens on a push
# to main; somebody has to open Actions and press the button. That is the
# human signature this repository's tag has always carried, moved from a
# local `git tag` to a click.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Bump and publish
    # macOS, not ubuntu: codesign and notarytool only exist here, and bun
    # cross-compiles the Linux binary from either host equally well, so moving
    # the whole job costs nothing the Linux build needed ubuntu for.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # bumpFor reads every commit since the last v* tag. The default
          # checkout is a shallow clone of one commit, which would read as
          # "nothing to release" today and as a wrong, truncated range the day
          # the distance to the last tag grows past what the default keeps.
          fetch-depth: 0

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both toolchains, installed together before anything runs, rather than
      # bun arriving only once the build steps need it: the first real run of
      # this workflow failed thirteen seconds in on exactly that, installed
      # after the step that needed it, invisible locally because a developer's
      # PATH already has both.
      #
      # Node is still here now that everything else is bun, and it is not a
      # leftover: `src/boundary.test.ts` and `src/cli.test.ts` spawn the CLI
      # under it, which is how the rule that this package runs on more than one
      # runtime is checked at all. Dropping node here would delete that proof
      # while leaving the tests looking green.
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Writes package.json, CHANGELOG.md and src/runner/index.ts's RUNNER_VERSION to
      # the working tree if there is a feat: or a fix: since the last tag.
      # Nothing here touches git: a write to disk that turns out to be wrong
      # costs a rerun, a commit and a tag do not.
      - name: Compute the next release
        id: prepare
        run: bun run release -- --apply

      # Everything past this point only runs when prepare.ts found something to
      # release. A dispatch with nothing new exits here, cleanly, rather than
      # cutting a version that changes no bytes.
      - name: Typecheck
        if: steps.prepare.outputs.should_release == 'true'
        run: bun run typecheck

      - name: Test
        if: steps.prepare.outputs.should_release == 'true'
        run: bun test --timeout 60000

      - name: Build macOS arm64
        if: steps.prepare.outputs.should_release == 'true'
        run: bun run build:macos-arm64

      # Apple Silicon shipped in 2020 and an Intel Mac bought the year before
      # is still five years old today, not retired. Reported live against
      # v0.1.2: an Intel Mac downloading crewbit-macos-arm64 (the only macOS
      # binary that existed) got Gatekeeper's "is damaged" refusal, the same
      # wording an unsigned binary gets on the right architecture too — so the
      # missing target read as a signing problem until somebody checked.
      - name: Build macOS x64
        if: steps.prepare.outputs.should_release == 'true'
        run: bun run build:macos-x64

      - name: Build Linux x64
        if: steps.prepare.outputs.should_release == 'true'
        run: bun run build:linux-x64

      # A temporary keychain rather than the runner's default one, unlocked
      # only for this job and thrown away when it ends: the certificate exists
      # on disk for the seconds codesign needs it, decoded from the secret and
      # deleted again immediately after import.
      - name: Import the signing certificate
        if: steps.prepare.outputs.should_release == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      # The identity's exact name carries the developer's own name and Team ID
      # inside it, so it is read off the certificate just imported rather than
      # assembled from secrets that would have to match Apple's formatting.
      #
      # --options runtime is the hardened runtime, and notarization refuses a
      # binary built without it. --timestamp asks for a trusted timestamp on
      # the signature, which notarization also expects. --force because the
      # two binaries do not start from the same place: bun's cross-compiled
      # darwin-x64 runtime ships already signed under Bun's own Team ID, and
      # codesign refuses to sign over that without being told to; arm64 only
      # carries the ad-hoc signature the linker always attaches, which codesign
      # is willing to replace on its own. --force makes both paths the same
      # instead of relying on which binary happened to need it today.
      - name: Sign the macOS binaries
        if: steps.prepare.outputs.should_release == 'true'
        run: |
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.+)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::no Developer ID Application identity found in the imported certificate"
            exit 1
          fi
          for bin in bin/crewbit-macos-arm64 bin/crewbit-macos-x64; do
            codesign --force --sign "$IDENTITY" --options runtime --timestamp "$bin"
            codesign --verify --verbose "$bin"
          done

      # notarytool takes a zip, a dmg or a pkg, never a bare executable, so
      # each binary is zipped only to be handed to Apple and the zip is gone
      # once that call returns. --wait blocks until Apple's service answers,
      # which is minutes rather than seconds and is why this step is the slow
      # one in the job.
      #
      # There is no staple step after this on purpose: stapling embeds the
      # notarization ticket in a bundle, and a bare Mach-O executable has
      # nowhere to embed one. Gatekeeper instead asks Apple's servers for the
      # ticket the first time each binary runs, which needs network access
      # once, the same trade a stapled app avoids and a bare binary cannot.
      - name: Notarize the macOS binaries
        if: steps.prepare.outputs.should_release == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for bin in bin/crewbit-macos-arm64 bin/crewbit-macos-x64; do
            ditto -c -k --keepParent "$bin" "$bin.zip"
            xcrun notarytool submit "$bin.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            rm "$bin.zip"
          done

      # Nothing is written to the repository above this line. The build
      # succeeding is what earns the commit, the tag and the Release below —
      # not the other way around. A failed build before this point leaves the
      # working tree's uncommitted edits behind when the job ends and nothing
      # else changed; a failed build after it would leave a tag with no
      # Release behind it, on a public repository, for somebody to find and no
      # cheap way to undo.
      - name: Commit the release
        if: steps.prepare.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md src/runner/index.ts
          git commit -m "chore: bump v${{ steps.prepare.outputs.version }}"
          git push origin HEAD:main

      - name: Tag it
        if: steps.prepare.outputs.should_release == 'true'
        run: |
          git tag "v${{ steps.prepare.outputs.version }}"
          git push origin "v${{ steps.prepare.outputs.version }}"

      # Carried over from the service: the changelog
      # ships with the binary, not only with the repository.
      - name: Extract this version's changelog section
        if: steps.prepare.outputs.should_release == 'true'
        run: >
          bun -e '
          import { readFileSync, writeFileSync } from "node:fs";
          import { sectionFor } from "./tools/release/notes.ts";
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          writeFileSync("release-notes.md", sectionFor(changelog, process.env.VERSION));
          '
        env:
          VERSION: ${{ steps.prepare.outputs.version }}

      - name: Publish the release
        if: steps.prepare.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.prepare.outputs.version }}
          tag_name: v${{ steps.prepare.outputs.version }}
          body_path: release-notes.md
          files: |
            bin/crewbit-macos-arm64
            bin/crewbit-macos-x64
            bin/crewbit-linux-x64
            CHANGELOG.md
